- id: oidc
  conforms: partial
  evidence: nbictl supports `--auth_strategy=oidc` with `--client_id` and `--token_url`
    for deployments fronted by an OIDC provider, but Aalyria publishes no issuer or
    discovery document
- id: opentelemetry
  conforms: true
  evidence: StatusService.GetMetrics returns opentelemetry.proto.metrics.v1 Gauge and
    Sum messages
- id: google-rpc-status
  conforms: true
  evidence: google.rpc.Status and google.rpc.Code are used for RPC errors and for embedded
    enactment outcomes in api/common/control.proto and api/nbi/v1alpha/resources/intent.proto
- id: rfc9457-problem-details
