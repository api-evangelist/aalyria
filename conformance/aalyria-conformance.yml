standards:
- id: grpc
  conforms: true
  evidence: 13 gRPC services / 182 RPCs defined across api/**; documented at https://docs.spacetime.aalyria.com/dev-guides/grpc/
- id: protobuf-proto3
  conforms: true
  evidence: every definition file declares `syntax = "proto3"`; documented at https://docs.spacetime.aalyria.com/dev-guides/protobuf/
- id: semver-2.0.0
  conforms: true
  evidence: 'GetVersionResponse.build_version documented as "Uses Semantic Versioning
    2.0.0 format. See: https://semver.org/"; policy at https://docs.spacetime.aalyria.com/dev-guides/semver/'
- id: rfc7519-jwt
  conforms: true
  evidence: authentication uses self-signed JWTs with iss/sub/aud/exp/iat claims and
    a kid header
- id: rfc7518-rs256
  conforms: true
  evidence: JWTs are signed RS256 (RSASSA-PKCS1-v1_5 using SHA-256)
- id: x509
  conforms: true
  evidence: credential enrollment is a self-signed x509 certificate carrying the client's
    RSA public key
- id: oauth2
  conforms: false
  evidence: no OAuth2 authorization server, no token endpoint and no scope vocabulary
