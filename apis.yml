aid: aalyria
name: Aalyria
description: 'Aalyria Technologies builds software and hardware for operating resilient,
  high-throughput networks in motion across space, air, land and sea. Its flagship
  platform, Spacetime, is a temporospatial software-defined networking (SDN) system
  that models the time-dynamic position and orientation of satellites, aircraft, ships
  and ground stations, then continuously plans, schedules and steers the links between
  them. Spacetime is programmable through three open, Apache-2.0 licensed gRPC/Protocol
  Buffers APIs published at github.com/aalyria/api: a Northbound Interface (NBI) for
  defining and orchestrating the network model and provisioning traffic-engineering
  policies, a Southbound Interface (SBI, also called CDPI) through which participating
  devices receive schedule updates and push telemetry, and a Federation (East-West)
  API through which peer network operators request and supply interconnections and
  capacity. Aalyria also produces Tightbeam, a free-space optical communications system.
  The company was spun out of Alphabet in 2022, carrying technology developed for
  Project Loon and Taara.'
