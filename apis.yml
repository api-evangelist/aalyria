apis:
- aid: aalyria:spacetime-nbi
  name: Spacetime Northbound Interface (NBI)
  description: 'The Northbound Interface allows humans or applications to define and
    orchestrate a Spacetime network. It carries the Model API (NMTS entities and relationships
    describing platforms, antennas, interfaces and their time-dynamic position and
    orientation), the Provisioning API (traffic-engineering policies, links, downtimes,
    protection and disjoint association groups, geographic regions), the Solution
    API (computed beams and candidate paths), the Simulation API (scenarios and analyses),
    Permissions and Audit Logs. It is a gRPC API defined in Protocol Buffers and served
    per customer instance over subdomain-resolved endpoints such as model-v1.$DOMAIN.'
  humanURL: https://docs.spacetime.aalyria.com/api/nbi/
  baseURL: https://nbi.example.spacetime.aalyria.com
  x-endpoint-pattern: <service>-<version>.$DOMAIN (subdomain endpoint resolution; per-customer
    Spacetime instance domain issued by Aalyria)
  tags:
  - Orchestration
  - Networking
  - Provisioning
  - Modeling
  - gRPC
  properties:
  - type: Protobuf
    url: grpc/api/model/v1/model.proto
  - type: Documentation
    url: https://docs.spacetime.aalyria.com/api/nbi/
  - type: GettingStarted
    url: https://docs.spacetime.aalyria.com/api/nbi/build-your-first-scenario/
- aid: aalyria:spacetime-sbi
  name: Spacetime Southbound Interface (SBI / CDPI)
  description: 'The Southbound Interface, also called the Control to Data-plane Interface
    (CDPI), is the collection of gRPC services through which devices participating
    in a Spacetime network communicate with the controller. The Scheduling service
    is a bidirectional stream over which an agent receives schedule updates — steering
    antenna beams to establish new links, configuring RF parameters, applying flow
    and radio control — and returns responses; the Telemetry service pushes metrics
    and observations back to Spacetime. A reference Go implementation of an SBI agent
    ships in the same repository.'
  humanURL: https://docs.spacetime.aalyria.com/api/sbi/
  baseURL: https://nbi.example.spacetime.aalyria.com
  x-endpoint-pattern: <service>-<version>.$DOMAIN (subdomain endpoint resolution; per-customer
    Spacetime instance domain issued by Aalyria)
  tags:
  - Telemetry
  - Streaming
  - Networking
  - Control Plane
  - gRPC
  properties:
  - type: Protobuf
    url: grpc/api/scheduling/v1alpha/scheduling.proto
  - type: Documentation
    url: https://docs.spacetime.aalyria.com/api/sbi/
- aid: aalyria:spacetime-federation
  name: Spacetime Federation API (East-West Interface)
  description: 'The Federation API, or East-West Interface, allows peer networks to
    request and to supply network resources and interconnections between partners''
    networks. It carries the Interconnect service, through which operators negotiate
    and manage interconnection points and service requests between distinct networks,
    and the Transponder service, through which capacity on a transponded payload is
    advertised, requested and scheduled. This facilitates dynamic, real-time inter-network
    connections so operators can supplement gaps in coverage or advertise unused capacity.'
  humanURL: https://docs.spacetime.aalyria.com/api/federation/
  baseURL: https://nbi.example.spacetime.aalyria.com
  x-endpoint-pattern: <service>-<version>.$DOMAIN (subdomain endpoint resolution; per-customer
    Spacetime instance domain issued by Aalyria)
  tags:
  - Federation
  - Interconnection
  - Satellite
  - Capacity
  - gRPC
  properties:
  - type: Protobuf
    url: grpc/api/federation/interconnect/v1alpha/interconnect.proto
  - type: Documentation
    url: https://docs.spacetime.aalyria.com/api/federation/
- aid: aalyria:spacetime-status
  name: Spacetime Status API
  description: 'The Status API is a small operational gRPC service exposed by every
    Spacetime instance. GetVersion returns the semantic version of the running Spacetime
    build, and GetMetrics returns instance insight metrics encoded in the standard
    OpenTelemetry metrics protobuf format — platform-type counts and inbound/outbound
    scheduling message counts. It is reachable through the nbictl command line tool
    as status-v1 and is the surface used to confirm connectivity and credentials against
    a new deployment.'
  humanURL: https://docs.spacetime.aalyria.com/api/
  baseURL: https://nbi.example.spacetime.aalyria.com
  x-endpoint-pattern: status-v1.$DOMAIN
  tags:
  - Status
  - Metrics
  - OpenTelemetry
  - Observability
  - gRPC
  properties:
  - type: Protobuf
    url: grpc/api/status/v1/status.proto
