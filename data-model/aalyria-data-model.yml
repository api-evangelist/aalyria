note: 'Derived from the published protobuf definitions. Spacetime has no OpenAPI, so
  relationships were read from proto imports, message field types and the explicit
  Relationship model of the Model API rather than from JSON Schema $ref links. Only
  entities that exist as named messages in the shipped protos are listed.'
core_concept: 'Spacetime is a temporospatial digital twin. The Model API stores a graph
  of NMTS Entities and typed Relationships describing physical and logical assets and
  their time-dynamic motion; the Provisioning API layers intent (traffic-engineering
  policies, links, downtimes, constraint groups) on top of that graph; the Solution
  API exposes what the solver computed (beams, candidate paths); the SBI enacts it
  on devices and streams telemetry back.'
